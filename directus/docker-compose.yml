# Directus CMS + Postgres for the Selected Work grid.
# Deploy as a SEPARATE Coolify resource (Docker Compose type) — NOT part of the
# site's Dockerfile build. Coolify assigns the domain (cms.darlingdesign.pro) to
# the `directus` service on port 8055 and terminates TLS at its proxy.
#
# Set every ${VAR} below in Coolify's Environment Variables tab (see .env.example).

services:
  database:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', '${DB_USER}', '-d', '${DB_DATABASE}']
      interval: 10s
      timeout: 5s
      retries: 6

  directus:
    image: directus/directus:11
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - uploads:/directus/uploads
    # Reachable by Coolify's proxy and sibling containers, but not published
    # directly on the host where it could bypass TLS and proxy protections.
    expose:
      - '8055'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8055/server/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
    environment:
      KEY: ${DIRECTUS_KEY}
      SECRET: ${DIRECTUS_SECRET}

      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      # Public origin of Directus itself — must match the Coolify domain.
      PUBLIC_URL: ${PUBLIC_URL}

      # Let the portfolio's browser JS call the /items API cross-origin.
      CORS_ENABLED: 'true'
      CORS_ORIGIN: ${CORS_ORIGIN}
      CORS_METHODS: 'GET'
      CORS_ALLOWED_HEADERS: 'Content-Type'
      CORS_CREDENTIALS: 'false'

      RATE_LIMITER_ENABLED: 'true'
      RATE_LIMITER_POINTS: '100'
      RATE_LIMITER_DURATION: '1'

      # Keep arbitrary asset-transform requests from exhausting CPU/memory.
      ASSETS_TRANSFORM_MAX_CONCURRENT: '5'
      ASSETS_TRANSFORM_IMAGE_MAX_OUTPUT_DIMENSION: '1600'
      ASSETS_TRANSFORM_TIMEOUT: '5000ms'
      ASSETS_TRANSFORM_MAX_OPERATIONS: '3'

      HSTS_ENABLED: 'true'
      HSTS_MAX_AGE: '31536000'
      REFRESH_TOKEN_COOKIE_SECURE: 'true'
      REFRESH_TOKEN_COOKIE_SAME_SITE: 'lax'

      WEBSOCKETS_ENABLED: 'true'

  bootstrap:
    image: node:22-alpine
    restart: 'no'
    depends_on:
      directus:
        condition: service_healthy
    volumes:
      - ./bootstrap.mjs:/bootstrap.mjs:ro
    environment:
      DIRECTUS_URL: http://directus:8055
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    command: ['node', '/bootstrap.mjs']

volumes:
  db-data:
  uploads:
